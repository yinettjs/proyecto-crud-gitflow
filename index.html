<!DOCTYPE html>
<html lang="es">
<head>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto CRUD</title>
</head>
</head>
<body>
  <h1>Gestión de Usuarios (CRUD)</h1>
  <input type="text" id="userInput" placeholder="Nombre de usuario">
  <button id="btnAgregar">Agregar</button>

  <ul id="listaUsuarios"></ul>

  <script>
    const btn = document.getElementById('btnAgregar');
    const input = document.getElementById('userInput');
    const lista = document.getElementById('listaUsuarios');

    btn.addEventListener('click', () => {
      if (input.value.trim() === '') return;
      const li = document.createElement('li');
      li.textContent = input.value + " ";
      
      const btnBorrar = document.createElement('button');
      btnBorrar.textContent = 'Eliminar';
      btnBorrar.onclick = () => li.remove();

      li.appendChild(btnBorrar);
      lista.appendChild(li);
      input.value = '';
    });
  </script>
</body>
</html>

//comentario: Este código HTML crea una interfaz simple para gestionar usuarios mediante operaciones CRUD (Crear, Leer, Actualizar, Eliminar). Los usuarios pueden agregar nombres a una lista y eliminarlos según sea necesario.
